<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JEV State · PvZ 只读监视器</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/state-page.js" defer></script>
</head>
<body class="state-page">
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">✿</div>
    <div><h1>State 观察</h1></div>
    <nav class="page-nav" aria-label="页面导航"><a href="/">草坪状态</a><a class="active" href="/state">State 观察</a><a href="/jev">JEV Runtime</a></nav>
  </header>
  <main class="state-main">
    <section class="state-summary panel" aria-live="polite">
      <div><span class="summary-label">连接状态</span><strong id="state-status">正在连接</strong></div>
      <div><span class="summary-label">采样时间</span><strong id="state-time">等待采样</strong></div>
      <div><span class="summary-label">采样序号</span><strong id="state-sequence">—</strong></div>
      <div><span class="summary-label">有效 / 决策就绪</span><strong id="state-valid">—</strong></div>
    </section>
    <p id="state-error" class="state-error" role="status" hidden></p>
    <section class="panel json-observer">
      <div class="profile-switch" role="group" aria-label="State profile">
        <button type="button" data-state-profile="jev" aria-pressed="true">JEV State</button>
        <button type="button" data-state-profile="all" aria-pressed="false">All State</button>
        <strong id="state-profile-label">当前：JEV State</strong>
      </div>
      <div class="section-heading">
        <div><h2 id="state-json-title">JEV State 快照</h2></div>
        <div class="json-actions">
          <span id="state-copy-status" class="copy-status" role="status" aria-live="polite"></span>
          <button id="state-copy-button" class="copy-button" type="button" aria-label="复制当前 JEV State JSON" disabled>复制 JSON</button>
          <span id="state-availability" class="state-badge unavailable">等待采样</span>
        </div>
      </div>
      <div id="state-json" class="json-tree" role="region" aria-label="State JSON" aria-live="off">等待 State 采样…</div>
    </section>
  </main>
</body>
</html>

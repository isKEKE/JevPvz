<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b0f">
  <title>JEV / PvZ 决策运行时</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/viewmodel.js" defer></script>
  <script src="/static/recording.js" defer></script>
</head>
<body class="rt-page">
  <header class="rt-bar">
    <!-- 三组信息：品牌 / 局面 / 运行控制。不再是一字排开的状态栏。 -->
    <div class="rt-group rt-group-brand">
      <span class="rt-brand-mark" aria-hidden="true">✳</span>
      <span class="rt-brand-name">JEV / PvZ</span>
      <span class="rt-brand-sub">AI Decision Runtime</span>
    </div>
    <div class="rt-group rt-group-state">
      <div class="rt-metric is-sun"><span>阳光</span><b id="m-sun">—</b></div>
      <div class="rt-metric"><span>波次</span><b id="m-wave">—</b></div>
      <div class="rt-metric"><span>关卡</span><b id="m-level">—</b></div>
      <div class="rt-metric"><span>模式</span><b id="m-mode">—</b></div>
    </div>
    <div class="rt-group rt-group-run">
      <span class="rt-status"><span class="rt-dot" id="m-run-dot" aria-hidden="true"></span>
        <span id="m-run-label">未连接</span></span>
      <time class="rt-clock" id="m-clock">--:--:--</time>
      <!-- 一个主控制：空闲显示运行，运行中换成停止。 -->
      <button id="runtime-start" class="rt-btn rt-btn-run" type="button" disabled>
        <span class="rt-btn-icon rt-icon-run" aria-hidden="true"></span>运行
      </button>
      <button id="runtime-stop" class="rt-btn rt-btn-stop" type="button" disabled hidden>
        <span class="rt-btn-icon rt-icon-stop" aria-hidden="true"></span>停止
      </button>
    </div>
  </header>

  <main class="rt-main">
    <div class="rt-workspace">
      <section class="rt-world" aria-label="世界状态">
        <div class="rt-world-head">
          <h2>世界模型</h2>
          <span class="rt-pane-meta">WORLD MODEL · 5 × 9</span>
        </div>
        <div class="rt-inventory" aria-label="可用卡槽">
          <span class="inv-count">可用 <b id="inv-available">—</b></span>
          <div class="inv-list" id="inv-list"><span class="empty-message">等待采样</span></div>
        </div>
        <div class="rt-world-main">
          <div class="rt-lawn-wrap">
            <div class="lawn" id="lawn" role="img" aria-label="五行九列草坪"></div>
          </div>
          <div class="rt-target" id="target" aria-label="当前目标与局面"></div>
        </div>
      </section>

      <section class="rt-viewport" aria-label="游戏窗口">
        <div class="rt-viewport-head">
          <h2>游戏窗口</h2>
          <span class="rt-pane-meta">800 × 600</span>
        </div>
        <!-- GameViewport：录制时由真实画面填充，这里只保留精确 800×600 的挂载点。 -->
        <div class="game-viewport" id="game-viewport" data-slot="capture">
          <span class="gv-label">800 × 600</span>
        </div>
        <!-- 把机器正在看的东西指回真实画面，建立两侧的关联。 -->
        <p class="rt-crossref" id="crossref"></p>
      </section>
    </div>

    <section class="rt-decision" aria-label="JEV 决策轨迹">
      <div class="rt-decision-head">
        <h2>决策轨迹</h2>
        <span class="rt-pane-meta">DECISION TRACE</span>
        <span class="rt-pane-meta" id="decision-meta"></span>
      </div>
      <div class="rt-chain">
        <div class="rt-stage" data-stage="observe">
          <span class="stage-label">Observe</span>
          <div class="stage-body" id="stage-observe"><p class="stage-empty">等待采样</p></div>
        </div>
        <span class="stage-arrow" aria-hidden="true">›</span>
        <div class="rt-stage" data-stage="intent">
          <span class="stage-label">Intent</span>
          <div class="stage-body" id="stage-intent"><p class="stage-empty">等待决策</p></div>
        </div>
        <span class="stage-arrow" aria-hidden="true">›</span>
        <div class="rt-stage" data-stage="option">
          <span class="stage-label">Option</span>
          <div class="stage-body" id="stage-option"><p class="stage-empty">等待决策</p></div>
        </div>
        <span class="stage-arrow" aria-hidden="true">›</span>
        <div class="rt-stage" data-stage="action">
          <span class="stage-label">Action</span>
          <div class="stage-body" id="stage-action"><p class="stage-empty">等待决策</p></div>
        </div>
      </div>
      <!-- 列与上方草坪逐列对齐，观众可以竖直对照“世界里的位置”。 -->
      <div class="rt-bottom">
        <div class="rt-position">
          <div class="rt-position-head">
            <span class="stage-label">Position</span>
            <span class="rt-pane-meta" id="field-provenance"></span>
          </div>
          <div class="rt-field">
            <!-- 轨道 / 竖轴 / 信号都在这一层，压在节点下面。 -->
            <svg class="field-svg" id="field-svg" aria-hidden="true"></svg>
            <div class="rt-field-grid" id="field-grid"></div>
            <span class="field-coord" id="field-coord" hidden></span>
          </div>
        </div>
      </div>
      <svg class="rt-trace" id="trace" aria-hidden="true"></svg>
    </section>
  </main>
</body>
</html>
